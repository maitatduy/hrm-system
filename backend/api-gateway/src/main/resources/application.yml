server:
  port: ${API_GATEWAY_PORT}

spring:
  # Cùng Redis với auth-service: gateway đọc blacklist và token_version để chặn token đã thu hồi
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          # Tắt cứng: locator tự mở đường /{service-id}/** tới mọi service đăng ký Eureka, đi vòng qua các route
          # và quy tắc phân quyền khai báo bên dưới. Không đọc từ biến môi trường để không vô tình bật lại.
          enabled: false
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI}
          predicates:
            - Path=/api/auth/**, /api/accounts/**
        - id: employee-service
          uri: ${EMPLOYEE_SERVICE_URI}
          predicates:
            - Path=/api/employees/**, /api/departments/**, /api/positions/**
        - id: attendance-service
          uri: ${ATTENDANCE_SERVICE_URI}
          predicates:
            - Path=/api/attendances/**, /api/shifts/**
        - id: leave-service
          uri: ${LEAVE_SERVICE_URI}
          predicates:
            - Path=/api/leaves/**, /api/leave-requests/**, /api/leave-types/**, /api/leave-balances/**
        - id: payroll-service
          uri: ${PAYROLL_SERVICE_URI}
          predicates:
            - Path=/api/payrolls/**, /api/payslips/**

# Chỉ khóa ký access token. Gateway không bao giờ giữ JWT_REFRESH_SECRET.
jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA}
    fetch-registry: ${EUREKA_FETCH_REGISTRY}
