<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mã xác thực HRM System</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f5f4;font-family:Arial,Helvetica,sans-serif;color:#000000;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f5f4;padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:480px;background-color:#ffffff;border:1px solid #e6e6e6;border-radius:12px;">
                <tr>
                    <td style="padding:32px;">
                        <p style="margin:0 0 8px;font-size:15px;color:#615d59;">HRM System</p>
                        <h1 style="margin:0 0 24px;font-size:22px;font-weight:700;">Mã xác thực của bạn</h1>
                        <p style="margin:0 0 24px;font-size:36px;font-weight:700;letter-spacing:8px;color:#0075de;"
                           th:text="${otp}">123456</p>
                        <p style="margin:0 0 8px;font-size:15px;line-height:1.5;">
                            Mã có hiệu lực trong <strong th:text="${validityMinutes} + ' phút'">5 phút</strong>.
                            Không chia sẻ mã này với bất kỳ ai.
                        </p>
                        <p style="margin:0;font-size:14px;line-height:1.5;color:#615d59;">
                            Nếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email này.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
