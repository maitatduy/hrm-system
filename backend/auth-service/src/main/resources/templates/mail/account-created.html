<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản HRM System của bạn</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f5f4;font-family:Arial,Helvetica,sans-serif;color:#000000;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f5f4;padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:480px;background-color:#ffffff;border:1px solid #e6e6e6;border-radius:12px;">
                <tr>
                    <td style="padding:32px;">
                        <p style="margin:0 0 8px;font-size:15px;color:#615d59;">HRM System</p>
                        <h1 style="margin:0 0 24px;font-size:22px;font-weight:700;">Tài khoản của bạn đã được tạo</h1>
                        <p style="margin:0 0 4px;font-size:14px;color:#615d59;">Email đăng nhập</p>
                        <p style="margin:0 0 16px;font-size:16px;font-weight:600;" th:text="${email}">nguyenvana@hrm.vn</p>
                        <p style="margin:0 0 4px;font-size:14px;color:#615d59;">Mật khẩu tạm thời</p>
                        <p style="margin:0 0 24px;font-size:20px;font-weight:700;letter-spacing:1px;color:#0075de;font-family:Consolas,Menlo,monospace;"
                           th:text="${temporaryPassword}">Ab3$xyz</p>
                        <p style="margin:0 0 8px;font-size:15px;line-height:1.5;">
                            Hãy đăng nhập và đổi mật khẩu ngay trong mục Cài đặt. Không chia sẻ mật khẩu này với bất kỳ ai.
                        </p>
                        <p style="margin:0;font-size:14px;line-height:1.5;color:#615d59;">
                            Nếu bạn không mong đợi email này, hãy liên hệ bộ phận Nhân sự.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
